<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050711"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Merry Christmas · 3D 粒子圣诞树</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050d;color:#fff;font-family:Georgia,'Times New Roman',serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}.copy{position:fixed;left:7vw;top:34%;z-index:2;pointer-events:none;text-shadow:0 0 24px #9bcaff66}.copy h1{font-size:clamp(30px,5vw,66px);font-weight:400;letter-spacing:.03em;margin:0 0 12px}.copy p{font:12px/1.8 system-ui,sans-serif;letter-spacing:.28em;color:#b9c9e5;margin:0}.hint{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:13px/1.4 system-ui,sans-serif;letter-spacing:.08em;color:#aab9d4;white-space:nowrap;text-align:center}.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 60% 53%,transparent 20%,#02040caa 90%)}@media(max-width:650px){.copy{left:7vw;top:max(10%,env(safe-area-inset-top))}.copy h1{font-size:34px}.copy p{font-size:11px}.hint{bottom:max(14px,env(safe-area-inset-bottom));font-size:12px;max-width:92vw;white-space:normal}}
</style></head>
<body><canvas id="scene"></canvas><div class="copy"><h1>Merry Christmas</h1><p>MAKE A WISH · 2026</p></div><div class="glow"></div><div class="hint">拖动旋转 · 滚轮缩放　 DRAG TO ROTATE · SCROLL TO ZOOM</div>
<script>
(()=>{const c=document.querySelector('#scene'),ctx=c.getContext('2d',{alpha:false});let w,h,dpr,angle=0,zoom=1,drag=false,lastX=0,lastY=0,tilt=-.25;const rnd=(a,b)=>a+Math.random()*(b-a),tau=Math.PI*2,tree=[],ground=[],stars=[],heart=[],snow=[];
function init(){tree.length=ground.length=stars.length=heart.length=snow.length=0;for(let i=0;i<10500;i++){let u=Math.random(),fill=i>7350,h=(fill?Math.random()**1.9:u**1.6),y=12*h+.2,r=(1-h)**1.1*(fill?4.3:3.2)*(1+.65*Math.max(0,Math.sin((h*5.8+.15)*tau)));let a=fill?rnd(0,tau):u*9*tau+rnd(-.22,.22);r*=fill?Math.sqrt(Math.random()):rnd(.85,1.08);let g=fill?rnd(165,225):155+90*Math.max(.15,1-Math.abs(h-.55)*1.5)+rnd(-15,20),b=fill?rnd(190,250):185+70*Math.max(.15,1-Math.abs(h-.55)*1.5)+rnd(-15,35);if(Math.random()<.08){g=255;b=245}tree.push([Math.cos(a)*r+(fill?rnd(-.08,.08):0),y,Math.sin(a)*r+(fill?rnd(-.08,.08):0),`rgb(255,${g|0},${Math.min(255,b)|0})`])}
for(let i=0;i<1800;i++){let rr=[4.6,6,7.4,8.8,10.2,11.4][Math.random()*6|0]+rnd(-.4,.4),a=rnd(0,tau),v=rnd(190,255);ground.push([Math.cos(a)*rr,-.25,Math.sin(a)*rr,`rgb(${v|0},${v|0},255)`])}for(let i=0;i<650;i++)stars.push([rnd(-18,18),rnd(3,18),rnd(-18,18),`rgb(225,235,255)`]);while(heart.length<500){let x=rnd(-1.3,1.3),y=rnd(-1.4,1.4);if((x*x+y*y-1)**3-x*x*y**3<=0)heart.push([x*.72,12.05+(y+1)*.45,rnd(-.18,.18),'#ffb4d5'])}for(let i=0;i<28;i++)snow.push({x:rnd(0,w),y:rnd(-h,h),r:rnd(1,3),v:rnd(20,65),p:rnd(0,tau)})}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);init()}addEventListener('resize',resize);resize();
function project(p){let [x,y,z,col]=p,a=angle,xx=x*Math.cos(a)-z*Math.sin(a),zz=x*Math.sin(a)+z*Math.cos(a),cp=Math.cos(tilt),sp=Math.sin(tilt),yy=y*cp-zz*sp,depth=y*sp+zz*cp+13;if(depth<.2)return null;let f=Math.min(w,h)*.63/depth*zoom;return [w*.58+xx*f,h*.52-(yy-6)*f,depth,col,Math.max(.7,3.6-depth*.13)]}
let t=0;function frame(ms){let dt=Math.min(.04,(ms-t)/1000||0);t=ms;angle+=dt*.27;ctx.fillStyle='#03050d';ctx.fillRect(0,0,w,h);const pts=[];for(const p of ground.concat(tree,heart,stars)){let q=project(p);if(q&&q[0]>-10&&q[0]<w+10&&q[1]>-10&&q[1]<h+10)pts.push(q)}pts.sort((a,b)=>b[2]-a[2]);for(const [x,y,z,col,r] of pts){ctx.globalAlpha=Math.max(.24,Math.min(1,1-z/29));ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,tau);ctx.fill()}ctx.globalAlpha=1;for(const f of snow){f.y+=f.v*dt;f.x+=Math.sin(ms*.0004+f.p)*dt*13;if(f.y>h+8){f.y=-8;f.x=rnd(0,w)}ctx.fillStyle=`rgba(230,242,255,${.3+Math.sin(ms*.002+f.p)*.22})`;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,tau);ctx.fill()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
const pointers=new Map();let pinchStart=0,pinchZoom=1;c.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});c.setPointerCapture(e.pointerId);if(pointers.size===1){drag=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){drag=false;const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=zoom}});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom=Math.max(.65,Math.min(1.6,pinchZoom*dist/Math.max(1,pinchStart)));return}if(!drag)return;angle+=(e.clientX-lastX)*.008;tilt=Math.max(-.8,Math.min(.3,tilt+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});function endPointer(e){pointers.delete(e.pointerId);if(pointers.size===0)drag=false}c.addEventListener('pointerup',endPointer);c.addEventListener('pointercancel',endPointer);c.addEventListener('wheel',e=>{zoom=Math.max(.65,Math.min(1.6,zoom*(e.deltaY>0?.92:1.08)))},{passive:true});})();
</script></body></html>

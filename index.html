<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>圣诞粒子树 · 手势互动</title>
<style>
:root{color-scheme:dark;--gold:#ffd56a;--muted:#a69d85}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;background:#000}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#handVideo{position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;opacity:.01;pointer-events:none}
.hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
.topline{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.brand{display:flex;align-items:center;gap:9px;color:#e7d39a;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 16px #ffcf5d66}
.brand i{width:8px;height:8px;border-radius:50%;background:#ffd46c;box-shadow:0 0 14px 5px #ffd46c99;display:block}
.topline .hint{font-size:11px;color:#817a6b;letter-spacing:.08em}
.controls{position:absolute;left:18px;right:18px;bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;pointer-events:auto}
button,input{font:inherit}
button{border:1px solid #6e6248;background:#080808;color:#d8c58d;border-radius:999px;padding:10px 14px;min-height:42px;cursor:pointer;touch-action:manipulation;box-shadow:0 0 18px #000}
button:active{transform:scale(.97)}
button.active{background:#d9ad45;color:#130f07;border-color:#f7d981;box-shadow:0 0 25px #d9ad4570}
button.secondary{border-color:#3e3b36;color:#aaa39a}
.namebox{display:flex;align-items:center;gap:6px;background:#080808e8;border:1px solid #39342b;border-radius:999px;padding:4px 6px 4px 12px}
.namebox label{font-size:11px;color:#8c836e;letter-spacing:.08em}
.namebox input{width:76px;border:0;outline:0;background:transparent;color:#ffe18a;text-align:center;font-size:15px;padding:5px}
.status{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;white-space:nowrap;text-align:center;font-size:12px;color:#b3aa95;letter-spacing:.08em;text-shadow:0 0 13px #000;max-width:90vw}
.status strong{color:#f5d67d;font-weight:500}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;max-width:80vw;padding:12px 16px;border:1px solid #6c5d3b;border-radius:14px;background:#090806ee;color:#f4d98d;font-size:13px;text-align:center;transition:.25s ease;z-index:4}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.splash{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:3;pointer-events:none;transition:opacity .8s ease}
.splash.hide{opacity:0}
.splash-inner{text-align:center}
.splash-title{font-family:Georgia,serif;font-size:clamp(27px,9vw,70px);font-weight:400;letter-spacing:.18em;color:#ffe49a;text-shadow:0 0 35px #e2ae4c99}
.splash-sub{margin-top:15px;color:#887e68;font-size:11px;letter-spacing:.28em}
@media(max-width:520px){.topline{padding-top:10px}.topline .hint{display:none}.controls{left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));gap:6px}.controls button{padding:9px 11px;font-size:12px;min-height:39px}.namebox{padding-left:8px}.namebox input{width:65px}.status{bottom:73px;font-size:11px}}
</style>
</head>
<body>
<div id="stage"></div>
<video id="handVideo" playsinline muted></video>
<div class="hud">
  <div class="topline">
    <div class="brand"><i></i><span id="brandName">MERRY CHRISTMAS</span></div>
    <div class="hint">触摸旋转 · 双指缩放</div>
  </div>
  <div id="status" class="status"><strong>圣诞树</strong> · 粒子正在聚合</div>
  <div class="controls">
    <div class="namebox"><label>名字</label><input id="nameInput" value="MERRY" maxlength="4" aria-label="粒子名字"></div>
    <button class="mode active" data-mode="tree">圣诞树</button>
    <button class="mode" data-mode="scatter">星云</button>
    <button class="mode" data-mode="heart">爱心</button>
    <button id="gestureBtn" class="secondary">开启手势</button>
    <button id="fullscreenBtn" class="secondary">全屏</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="splash" class="splash"><div class="splash-inner"><div class="splash-title">MERRY CHRISTMAS</div><div class="splash-sub">粒子正在点亮冬夜</div></div></div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var TAU=Math.PI*2, state='tree', stateLabel={tree:'圣诞树',scatter:'星云',heart:'爱心'};
var renderer,scene,camera,root,cloud,ornaments,heartOrbit,snow,clock;
var treePos,scatterPos,heartPos,currentPos,phases,particleColors,particleSizes,particleCount=7600;
var rotation=0,tilt=-0.08,zoom=1,intro=true,introStarted=0;
var pointers=new Map(),pinchStart=0,pinchZoom=1,lastX=0,lastY=0,dragging=false;
var handActive=false,handStream=null,hands=null,lastPalm=null,lastGestureAt=0;
var rndSeed=20261124;
function rnd(){rndSeed=(rndSeed*1664525+1013904223)>>>0;return rndSeed/4294967296}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lerp(a,b,t){return a+(b-a)*t}
function script(url){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
function loadAny(urls){return urls.reduce(function(p,url){return p.catch(function(){return script(url)})},Promise.reject())}
function showToast(message){var el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(function(){el.classList.remove('show')},2600)}
function setStatus(extra){$('#status').innerHTML='<strong>'+stateLabel[state]+'</strong> · '+extra}
function heartPoint(i,n,scale){
  var a=(i/n)*TAU, x=16*Math.pow(Math.sin(a),3), y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
  var depth=(rnd()-.5)*1.15, thickness=.62+.38*rnd();
  return [x*.18*scale*thickness, y*.18*scale*thickness+4.15, depth];
}
function fillTargets(){
  rndSeed=20261124;
  treePos=new Float32Array(particleCount*3);scatterPos=new Float32Array(particleCount*3);heartPos=new Float32Array(particleCount*3);currentPos=new Float32Array(particleCount*3);
  phases=new Float32Array(particleCount);particleColors=new Float32Array(particleCount*3);particleSizes=new Float32Array(particleCount);
  for(var i=0;i<particleCount;i++){
    var x=0,y=0,z=0,t;
    if(i<6200){
      t=rnd();y=.2+t*7.35;
      var tier=t<.33?1:t<.68?2:3, top=(y-.15)/7.55;
      var base=(1-top)*3.35+.18, angle=rnd()*TAU+y*(tier*1.3+1.4), radius=base*Math.sqrt(rnd())*(.74+.34*rnd());
      x=Math.cos(angle)*radius;z=Math.sin(angle)*radius;
      particleColors[i*3]=1;particleColors[i*3+1]=.59+.36*rnd();particleColors[i*3+2]=.13+.5*rnd();
      particleSizes[i]=1.5+3.2*rnd();
    }else if(i<7240){
      y=-1.2+rnd()*1.65;var rr=.18+.3*Math.sqrt(rnd()), aa=rnd()*TAU;x=Math.cos(aa)*rr;z=Math.sin(aa)*rr;
      particleColors[i*3]=.96;particleColors[i*3+1]=.42+.28*rnd();particleColors[i*3+2]=.09;
      particleSizes[i]=1.6+2.2*rnd();
    }else{
      var ba=rnd()*TAU, br=3.9+2.4*rnd();x=Math.cos(ba)*br;y=-.18+(rnd()-.5)*.15;z=Math.sin(ba)*br;
      particleColors[i*3]=.98;particleColors[i*3+1]=.65+.32*rnd();particleColors[i*3+2]=.22+.64*rnd();
      particleSizes[i]=1.8+3*rnd();
    }
    treePos[i*3]=x;treePos[i*3+1]=y;treePos[i*3+2]=z;
    var sa=rnd()*TAU, sr=3.2+7.6*Math.pow(rnd(),.5), sy=(rnd()-.25)*7.5;
    scatterPos[i*3]=Math.cos(sa)*sr;scatterPos[i*3+1]=sy;scatterPos[i*3+2]=Math.sin(sa)*sr;
    var hp=heartPoint(i,particleCount,.92);heartPos[i*3]=hp[0];heartPos[i*3+1]=hp[1];heartPos[i*3+2]=hp[2];
    currentPos[i*3]=scatterPos[i*3];currentPos[i*3+1]=scatterPos[i*3+1];currentPos[i*3+2]=scatterPos[i*3+2];
    phases[i]=rnd()*TAU;
  }
}
function shaderMaterial(){
  return new THREE.ShaderMaterial({
    uniforms:{uSizeBoost:{value:1},uScale:{value:1},uTint:{value:new THREE.Color(1,1,1)},uOpacity:{value:1}},
    vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:'attribute float aSize; varying vec3 vColor; uniform float uSizeBoost; uniform float uScale; void main(){vColor=color;vec4 mvPosition=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uSizeBoost*uScale*(300.0/-mvPosition.z);gl_Position=projectionMatrix*mvPosition;}',
    fragmentShader:'varying vec3 vColor; uniform vec3 uTint; uniform float uOpacity; void main(){vec2 p=gl_PointCoord-0.5;float d=length(p);if(d>0.5)discard;float glow=1.0-smoothstep(0.05,0.5,d);gl_FragColor=vec4(vColor*uTint,glow*uOpacity);}'
  });
}
function initThree(){
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x000000,1);$('#stage').appendChild(renderer.domElement);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,60);camera.position.set(0,3.2,15.5);camera.lookAt(0,3.25,0);
  root=new THREE.Group();scene.add(root);clock=new THREE.Clock();fillTargets();
  var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(currentPos,3));geo.setAttribute('color',new THREE.BufferAttribute(particleColors,3));geo.setAttribute('aSize',new THREE.BufferAttribute(particleSizes,1));
  cloud=new THREE.Points(geo,shaderMaterial());root.add(cloud);
  makeOrnaments();makeHeartOrbit();makeSnow();makeGifts();
  addEventListener('resize',resize);bindPointers();introStarted=performance.now();animate();setTimeout(function(){$('#splash').classList.add('hide')},1800);
}
function makeOrnaments(){
  var count=24,pos=new Float32Array(count*3),col=new Float32Array(count*3),sz=new Float32Array(count),colors=[[1,.15,.1],[.2,.55,1],[1,.75,.13],[.85,.25,.95],[.1,.9,.65]];
  for(var i=0;i<count;i++){var y=.55+rnd()*6.4,top=(y-.15)/7.55,r=(1-top)*3.35+.18,ang=rnd()*TAU+y*2.4,rr=r*(.82+.1*rnd());pos[i*3]=Math.cos(ang)*rr;pos[i*3+1]=y;pos[i*3+2]=Math.sin(ang)*rr;var cc=colors[i%colors.length];col.set(cc,i*3);sz[i]=9+7*rnd()}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
  ornaments=new THREE.Points(g,shaderMaterial());ornaments.material.uniforms.uSizeBoost.value=1.15;root.add(ornaments);
}
function makeHeartOrbit(){
  var n=340,pos=new Float32Array(n*3),col=new Float32Array(n*3),sz=new Float32Array(n);
  for(var i=0;i<n;i++){var a=rnd()*TAU,r=3.8+.55*rnd();pos[i*3]=Math.cos(a)*r;pos[i*3+1]=3.5+(rnd()-.5)*4.5;pos[i*3+2]=Math.sin(a)*r;col[i*3]=1;col[i*3+1]=.26+.36*rnd();col[i*3+2]=.52+.44*rnd();sz[i]=2+3*rnd()}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('aSize',new THREE.BufferAttribute(sz,1));heartOrbit=new THREE.Points(g,shaderMaterial());heartOrbit.material.uniforms.uSizeBoost.value=.9;root.add(heartOrbit);
}
function makeSnow(){
  var n=280,pos=new Float32Array(n*3),col=new Float32Array(n*3),sz=new Float32Array(n),vel=[];
  for(var i=0;i<n;i++){pos[i*3]=(rnd()-.5)*26;pos[i*3+1]=rnd()*16-3;pos[i*3+2]=(rnd()-.5)*18;col.set([.5,.62,.85],i*3);sz[i]=1.5+2.5*rnd();vel.push(.25+.7*rnd())}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('aSize',new THREE.BufferAttribute(sz,1));snow=new THREE.Points(g,shaderMaterial());snow.userData.vel=vel;snow.material.uniforms.uSizeBoost.value=.5;scene.add(snow);
}
function makeGifts(){
  var colors=[0xc73142,0x2b74b8,0xd39a2e,0x8c3f9f];
  for(var i=0;i<4;i++){var m=new THREE.MeshBasicMaterial({color:colors[i]});var box=new THREE.Mesh(new THREE.BoxGeometry(.62,.52,.62),m);var a=i*Math.PI/2+.35;box.position.set(Math.cos(a)*(1.1+.2*(i%2)),-.95,Math.sin(a)*(1.1+.2*(i%2)));box.rotation.y=a;root.add(box)}
}
function resize(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.position.z=innerWidth<600?16.8:15.5;camera.updateProjectionMatrix()}
function bindPointers(){
  var el=renderer.domElement;
  el.addEventListener('pointerdown',function(e){pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});el.setPointerCapture(e.pointerId);if(pointers.size===1){dragging=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){dragging=false;var a=Array.from(pointers.values());pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=zoom}});
  el.addEventListener('pointermove',function(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){var a=Array.from(pointers.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom=clamp(pinchZoom*d/Math.max(1,pinchStart),.72,1.45);return}if(dragging){rotation+=(e.clientX-lastX)*.008;tilt=clamp(tilt+(e.clientY-lastY)*.003,-.55,.35);lastX=e.clientX;lastY=e.clientY}});
  function end(e){pointers.delete(e.pointerId);if(pointers.size===0)dragging=false}el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',function(e){zoom=clamp(zoom*(e.deltaY>0?.92:1.08),.72,1.45)},{passive:true});
}
function targetFor(i,time){
  var x,y,z,ix=i*3;
  if(state==='tree'){x=treePos[ix];y=treePos[ix+1];z=treePos[ix+2]}
  else if(state==='heart'){x=heartPos[ix];y=heartPos[ix+1];z=heartPos[ix+2]}
  else{var a=time*.18+phases[i]*.03,c=Math.cos(a),s=Math.sin(a),sx=scatterPos[ix],sz=scatterPos[ix+2];x=sx*c-sz*s;y=scatterPos[ix+1]+Math.sin(time*.7+phases[i])*.13;z=sx*s+sz*c}
  return [x,y,z]
}
function animate(){
  requestAnimationFrame(animate);var time=clock.getElapsedTime(),now=performance.now();
  var introT=clamp((now-introStarted)/2200,0,1),introE=1-Math.pow(1-introT,3);
  var arr=cloud.geometry.attributes.position.array;
  for(var i=0;i<particleCount;i++){var ix=i*3,target=targetFor(i,time),tx=target[0],ty=target[1],tz=target[2];if(intro){tx=lerp(scatterPos[ix],tx,introE);ty=lerp(scatterPos[ix+1],ty,introE);tz=lerp(scatterPos[ix+2],tz,introE)}arr[ix]+=((tx-arr[ix])*.085);arr[ix+1]+=((ty-arr[ix+1])*.085);arr[ix+2]+=((tz-arr[ix+2])*.085)}
  if(introT>=1)intro=false;cloud.geometry.attributes.position.needsUpdate=true;
  root.rotation.y=rotation+time*.055;root.rotation.x=tilt;
  var tint=state==='heart'?new THREE.Color(1,.26,.56):new THREE.Color(1,.86,.48);cloud.material.uniforms.uTint.value.lerp(tint,.08);cloud.material.uniforms.uScale.value=zoom;
  ornaments.material.uniforms.uScale.value=zoom;heartOrbit.material.uniforms.uScale.value=zoom;
  heartOrbit.rotation.y=time*.12;heartOrbit.rotation.x=Math.sin(time*.65)*.08;
  var sp=snow.geometry.attributes.position.array,vel=snow.userData.vel;for(var j=0;j<vel.length;j++){var si=j*3;sp[si+1]-=vel[j]*.016;sp[si]+=Math.sin(time+phases[j%particleCount])*.003;if(sp[si+1]<-5){sp[si+1]=15;sp[si]=(rnd()-.5)*26}}snow.geometry.attributes.position.needsUpdate=true;
  renderer.render(scene,camera);
}
function setMode(next,fromGesture){
  if(!stateLabel[next])return;state=next;document.querySelectorAll('.mode').forEach(function(b){b.classList.toggle('active',b.dataset.mode===state)});setStatus(fromGesture?'手势控制中':'触摸拖动旋转 · 双指缩放');showToast(fromGesture?'手势：'+stateLabel[state]:stateLabel[state]);
}
document.querySelectorAll('.mode').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode,false)})});
$('#nameInput').addEventListener('input',function(){var value=this.value.trim().toUpperCase()||'MERRY';$('#brandName').textContent=value+' CHRISTMAS'});
$('#fullscreenBtn').addEventListener('click',function(){var el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(el.requestFullscreen)el.requestFullscreen();else showToast('当前浏览器不支持全屏')});
function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.hypot(dx,dy)}
function fingerOpen(lm,tip,pip){return dist(lm[tip],lm[0])>dist(lm[pip],lm[0])*1.15}
function palmGesture(lm){
  var index=fingerOpen(lm,8,6),middle=fingerOpen(lm,12,10),ring=fingerOpen(lm,16,14),pinky=fingerOpen(lm,20,18),thumb=dist(lm[4],lm[5])>dist(lm[3],lm[5])*1.15;
  var count=(index?1:0)+(middle?1:0)+(ring?1:0)+(pinky?1:0)+(thumb?1:0);
  if(index&&thumb&&!middle&&!ring&&!pinky)return'tree';
  if(count>=4)return'scatter';
  if(count===0)return'heart';
  return null;
}
function onHandResults(result){
  if(!handActive)return;var list=result.multiHandLandmarks||[];if(!list.length){lastPalm=null;return}
  var lm=list[0],g=palmGesture(lm),now=performance.now();
  if(g&&now-lastGestureAt>650){lastGestureAt=now;setMode(g,true)}
  var palm=lm[9];if(lastPalm){var dx=palm.x-lastPalm.x,dy=palm.y-lastPalm.y;if(Math.abs(dx)>.006)rotation-=dx*2.8;if(Math.abs(dy)>.008)tilt=clamp(tilt+dy*1.2,-.55,.35)}lastPalm={x:palm.x,y:palm.y}
}
async function startHands(){
  if(handActive){handActive=false;$('#gestureBtn').textContent='开启手势';if(handStream)handStream.getTracks().forEach(function(t){t.stop()});if(hands&&hands.close)try{await hands.close()}catch(e){}showToast('手势控制已关闭');return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast('此浏览器不支持摄像头，请使用触摸控制');return}
  try{
    $('#gestureBtn').textContent='加载手势…';
    await loadAny(['https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js','https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js','https://cdnjs.cloudflare.com/ajax/libs/mediapipe/0.4.1675469240/hands.js']);
    if(!window.Hands)throw new Error('hands unavailable');
    hands=new Hands({locateFile:function(file){return'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/'+file}});
    hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.62,minTrackingConfidence:.58});hands.onResults(onHandResults);
    handStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    $('#handVideo').srcObject=handStream;await $('#handVideo').play();handActive=true;$('#gestureBtn').textContent='关闭手势';setStatus('请张手散开、握拳切换爱心、拇指和食指闭合聚合');
    showToast('手势已开启');handLoop();
  }catch(err){handActive=false;$('#gestureBtn').textContent='开启手势';showToast('摄像头或手势模型加载失败，请用触摸控制')}
}
async function handLoop(){if(!handActive)return;try{if($('#handVideo').readyState>=2)await hands.send({image:$('#handVideo')})}catch(e){}requestAnimationFrame(handLoop)}
$('#gestureBtn').addEventListener('click',startHands);
async function boot(){
  try{await loadAny(['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js','https://unpkg.com/three@0.160.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js']);if(!window.THREE)throw new Error('three unavailable');initThree()}
  catch(e){$('#splash').classList.add('hide');showToast('3D 引擎加载失败，请刷新页面重试')}
}
boot();
})();
</script>
</body>
</html>
